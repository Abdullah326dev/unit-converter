<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Unit Converter</title>
</head>
<body>
    <div class="main-container">
        <div class="conv-box">
            <div class="head-box">
                <h1>Metric/Imperial Unit Conversion</h1>
                <div class="number-box">
                    <input type="text" id="number-input">
                </div>
                <button id="convert-btn">Convert</button>
            </div>
            <div class="warrning-box" id="warrning">
                <p></p>
            </div>
            <div class="content-box">
                <div class="matrix-box">
                    <h2>Length (Meter/Feet)</h2>
                    <p id="length-result">- meters = - feet | - feet = - meters</p>
                </div>
                <div class="matrix-box">
                    <h2>Volume (Liter/Gallon)</h2>
                    <p id="volume-result">- Liter = - Gallon | - Gallon = - Liter</p>
                </div>
                <div class="matrix-box">
                    <h2>Mass (Kilogram/Pound)</h2>
                    <p id="mass-result">- Kilogram = - Pound | - Pound = - Kilogram</p>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
